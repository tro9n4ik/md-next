name: Стенд MTU и восстановления SSH
on:
  push:
    branches: [codex/stability-linux-lab]
    paths:
      - .github/workflows/stability-linux-lab.yml
      - tests/linux-lab/**
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iperf3
          sudo bash tests/linux-lab/mtu.sh
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install paramiko==5.1.0
      - run: python tests/linux-lab/ssh_cleanup.py
      - run: sudo bash tests/linux-lab/sqlite_permissions.sh
