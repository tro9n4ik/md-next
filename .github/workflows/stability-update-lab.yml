name: Самообновление и MSS на одноразовой VM
on:
  push:
    branches: [codex/stability-linux-lab]
    paths:
      - .github/workflows/stability-update-lab.yml
      - tests/linux-lab/update_mss.sh
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: vmactions/ubuntu-vm@3b554fb5d71472e2d3829d9a11160de0d91f463b
        with:
          release: '24.04'
          mem: 6144
          copyback: false
          run: MDNEXT_DISPOSABLE_VM=1 bash tests/linux-lab/update_mss.sh
      - name: Диагностика хоста виртуальной машины
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -Ei 'oom|killed process|qemu|kvm' | tail -15 || true
