name: Проверки
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kedrlink-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Проверка установщика и настоящего systemd в одноразовой VM
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env "PATH=$PATH" MDNEXT_RUN_SYSTEMD_INSTALL_TEST=1 python -m pytest tests/test_kedrlink_installer.py -q --tb=short
        working-directory: backend
  node-transport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental/node-transport
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go vet ./...
      - run: go test -v ./...
      - run: go test -race ./...
      - run: go test -fuzz=FuzzOpen -fuzztime=5s .
      - run: go build -o mdnt ./cmd/mdnt
      - run: go build -o kedrlink-agent ./cmd/kedrlink-agent/main.go
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests/test_kedrlink_e2e.py -q
        working-directory: backend
        env:
          MDNEXT_TEST_KEDRLINK_BINARY: '${{ github.workspace }}/experimental/node-transport/kedrlink-agent'
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: sudo env "PATH=$PATH" python3 tests/linux_namespace.py --run
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python scripts/check-release-consistency.py
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m pip_audit -r requirements.txt
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Проверка лимитов на настоящем Nginx и повторного применения
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          sudo systemctl start nginx
          sudo python3 scripts/nginx-capacity.py
          sudo python3 scripts/nginx-capacity.py
          sudo nginx -t
          sudo nginx -T 2>/dev/null | grep -q 'worker_connections 8192;'
          test "$(systemctl show nginx -p LimitNOFILE --value)" -ge 65536
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y nftables iptables tcpdump iproute2 iputils-ping
      - run: sudo python3 scripts/test-network-mtu.py --run
      - run: sudo python3 scripts/test-awg-routing.py --run
      - run: sudo python3 scripts/test-migration-lease.py --run
