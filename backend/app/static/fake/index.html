<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD-Next - Сайт в разработке</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f5f7;
            color: #18181b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
        }
        h1 {
            color: #10b981;
            margin-bottom: 1rem;
        }
        p {
            color: #52525b;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            background-color: #e4e4e7;
            color: #3f3f46;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сайт находится в разработке</h1>
        <p>Мы работаем над улучшением нашего сервиса. Пожалуйста, зайдите позже.</p>
        <div class="badge">MD-Next Technology</div>
    </div>
</body>
</html>
